[project]
name = "proyecto-kantan"
version = "0.1.0"
description = "Aplicación web para profesores que automatiza la creación de Planes Diarios con IA y RAG"
requires-python = ">=3.11"

dependencies = [
    # Web Framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "sse-starlette>=2.0",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",

    # Authentication
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # AI / RAG
    "google-genai>=1.0",
    "chromadb>=0.5",

    # Document Processing
    "python-docx>=1.1",
    "docxtpl>=0.18",

    # Utilities
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "email-validator>=2.1.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "coverage>=7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
